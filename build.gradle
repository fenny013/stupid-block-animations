plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def releaseBaseName = project.archives_base_name
def releaseVersion = project.mod_version

repositories {
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://maven.fallenbreath.me/releases' }
    maven {url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.isxander.dev/releases'}
    maven { url 'https://maven.nucleoid.xyz/'}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}+${project.minecraft_version}"

    compileOnly("maven.modrinth:sodium:mc${project.minecraft_version}-${project.sodium_version}-fabric")
    // runtimeOnly("maven.modrinth:sodium:mc${project.minecraft_version}-${project.sodium_version}-fabric")

    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}+${project.minecraft_version}-fabric"
    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    include("me.fallenbreath:conditional-mixin-fabric:${project.fallenbreath_version}")
    implementation("me.fallenbreath:conditional-mixin-fabric:${project.fallenbreath_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.matching { it.name in ["remapJar", "sourcesJar", "remapSourcesJar"] }.configureEach {
	archiveBaseName.set(releaseBaseName)
	archiveVersion.set(releaseVersion)

	if (name == "remapJar") {
		archiveClassifier.set("")
	} else {
		archiveClassifier.set("sources")
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {}
}
